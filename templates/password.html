{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
{% if g.user.must_change_password %}<p>Replace your temporary password before continuing.</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current">Current password</label>
  <input id="current" name="current" type="password" required>
  <label for="new">New password (12 to 128 characters, not your username)</label>
  <input id="new" name="new" type="password" required>
  <label for="confirm">New password again</label>
  <input id="confirm" name="confirm" type="password" required>
  <p><button>Change password</button></p>
</form>
{% endblock %}
